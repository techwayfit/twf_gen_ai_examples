<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>021 AI Chatbot</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #1d4ed8;
      --accent2: #0f766e;
      --line: #e5e7eb;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #eff6ff, #f9fafb 45%, #ecfeff);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.06);
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      background: linear-gradient(90deg, #dbeafe, #ccfbf1);
      border-bottom: 1px solid var(--line);
    }

    .header h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .tab-btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .panel {
      display: none;
      padding: 16px;
    }

    .panel.active { display: block; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.95rem;
      color: var(--ink);
      background: white;
    }

    textarea { min-height: 96px; resize: vertical; }

    button.primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button.secondary {
      background: var(--accent2);
      border: 1px solid var(--accent2);
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .stop-btn {
      background: var(--danger);
      border: 1px solid var(--danger);
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      display: none;
    }

    .prompt-toggle {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 4px 0;
    }
    .prompt-toggle:hover { color: var(--ink); }
    .prompt-editor { display: none; margin-bottom: 8px; }
    .prompt-editor.open { display: block; }
    .prompt-editor textarea {
      width: 100%;
      min-height: 52px;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      resize: vertical;
    }

    .img-upload-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .img-upload-wrap input[type="file"] { display: none; }
    .img-upload-btn {
      border: 1px dashed var(--line);
      background: #fafafa;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .img-upload-btn:hover { border-color: var(--accent); color: var(--accent); }
    .img-preview {
      display: none;
      position: relative;
      max-width: 120px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .img-preview img { max-width: 100%; height: auto; display: block; }
    .img-preview .img-remove {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 12px;
      cursor: pointer;
      line-height: 20px;
      text-align: center;
    }

    .msg-assistant pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.82rem;
    }
    .msg-assistant code {
      background: #e2e8f0;
      color: #1e293b;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .msg-assistant pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }
    .msg-assistant h1, .msg-assistant h2, .msg-assistant h3 {
      margin: 8px 0 4px;
      line-height: 1.3;
    }
    .msg-assistant h1 { font-size: 1.2rem; }
    .msg-assistant h2 { font-size: 1.08rem; }
    .msg-assistant h3 { font-size: 1rem; }
    .msg-assistant ul { margin: 4px 0; padding-left: 20px; }
    .msg-assistant li { margin: 2px 0; }
    .msg-assistant a { color: var(--accent); text-decoration: underline; }
    .msg-assistant br { content: ""; display: block; margin: 4px 0; }

    .conv-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      max-height: 460px;
      overflow-y: auto;
      padding: 4px;
    }

    .msg-user, .msg-assistant {
      border-radius: 10px;
      padding: 10px 14px;
      max-width: 88%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg-user {
      align-self: flex-end;
      background: #dbeafe;
      color: #1e3a5f;
    }
    .msg-assistant {
      align-self: flex-start;
      background: #f0fdf4;
      color: #14532d;
      border: 1px solid #bbf7d0;
    }
    .msg-assistant .gen-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--accent2);
      background: white;
      color: var(--accent2);
      cursor: pointer;
      font-weight: 600;
    }
    .msg-assistant .gen-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg-assistant .msg-image {
      margin-top: 8px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      max-width: 100%;
    }
    .msg-assistant .msg-image img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .msg-assistant .msg-image .stage-label {
      padding: 4px 8px;
      font-size: 0.78rem;
      color: var(--muted);
      background: #f1f5f9;
      border-bottom: 1px dashed var(--line);
    }

    .status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .error {
      color: var(--danger);
      font-weight: 600;
    }

    .image-box {
      margin-top: 10px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      min-height: 300px;
      display: grid;
      place-items: center;
      background: #f8fafc;
      overflow: hidden;
    }

    .image-box img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .header h1 { font-size: 1.02rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1>021 AI Chatbot</h1>
        <p>Streaming text chat ({{ chat_model }}) and streaming image events ({{ image_model }})</p>
      </div>

      <div class="tabs">
        <button id="tab-chat" class="tab-btn active" type="button">Chat</button>
        <button id="tab-image" class="tab-btn" type="button">Image</button>
      </div>

      <section id="panel-chat" class="panel active">
        <div id="chatConversation" class="conv-box"></div>
        <hr style="margin:10px 0;border:none;border-top:1px solid var(--line);" />

        <button id="promptToggle" class="prompt-toggle" type="button">▸ Edit system prompt</button>
        <div id="promptEditor" class="prompt-editor">
          <textarea id="systemPromptInput" placeholder="Custom system prompt..."></textarea>
        </div>

        <div class="img-upload-wrap">
          <label class="img-upload-btn" for="chatImageInput">+ Add Image</label>
          <input id="chatImageInput" type="file" accept="image/*" />
          <div id="imgPreview" class="img-preview">
            <button class="img-remove" id="imgRemove" type="button">&times;</button>
            <img id="imgPreviewImg" alt="" />
          </div>
        </div>

        <label for="chatInput">Message</label>
        <textarea id="chatInput" placeholder="Share a URL or ask anything..."></textarea>
        <div class="row">
          <button id="chatSend" class="primary" type="button">Send</button>
          <button id="chatStop" class="stop-btn" type="button">Stop</button>
          <span id="chatStatus" class="status"></span>
        </div>
      </section>

      <section id="panel-image" class="panel">
        <label for="imageInput">Image Prompt</label>
        <textarea id="imageInput" placeholder="Generate an image of..."></textarea>
        <div class="row">
          <label for="imageSize">Size</label>
          <select id="imageSize" style="max-width: 180px;">
            <option value="1024x1024">1024x1024</option>
            <option value="1024x1536">1024x1536</option>
            <option value="1536x1024">1536x1024</option>
          </select>
          <button id="imageSend" class="secondary" type="button">Generate Image (Stream)</button>
        </div>
        <span id="imageStatus" class="status"></span>
        <div id="imageOutput" class="image-box"><span class="status">No image yet</span></div>
      </section>
    </div>
  </div>

  <script>
    const tabChat = document.getElementById('tab-chat');
    const tabImage = document.getElementById('tab-image');
    const panelChat = document.getElementById('panel-chat');
    const panelImage = document.getElementById('panel-image');

    tabChat.addEventListener('click', () => {
      tabChat.classList.add('active');
      tabImage.classList.remove('active');
      panelChat.classList.add('active');
      panelImage.classList.remove('active');
    });

    tabImage.addEventListener('click', () => {
      tabImage.classList.add('active');
      tabChat.classList.remove('active');
      panelImage.classList.add('active');
      panelChat.classList.remove('active');
    });

    async function consumeSseResponse(response, handlers) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        let split = buffer.split('\n\n');
        buffer = split.pop() || '';

        for (const chunk of split) {
          const lines = chunk.split('\n');
          let eventName = 'message';
          let data = '';

          for (const line of lines) {
            if (line.startsWith('event: ')) eventName = line.slice(7).trim();
            if (line.startsWith('data: ')) data += line.slice(6);
          }

          let parsed = {};
          try { parsed = JSON.parse(data || '{}'); } catch { parsed = { raw: data }; }
          if (handlers[eventName]) handlers[eventName](parsed);
        }
      }
    }

    // --- Markdown renderer ---
    function escapeHtml(text) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }

    function renderMarkdown(text) {
      let html = escapeHtml(text);
      const codeBlocks = [];
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
        codeBlocks.push(`<pre><code>${code}</code></pre>`);
        return `%%CB${codeBlocks.length - 1}%%`;
      });
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/((?:<li>[\s\S]*?<\/li>\n?)+)/g, '<ul>$1</ul>');
      html = html.replace(/\n/g, '<br>');
      html = html.replace(/%%CB(\d+)%%/g, (m, idx) => codeBlocks[parseInt(idx)] || m);
      return html;
    }

    // --- Session tracking for compact_chat ---
    let sessionId = localStorage.getItem('chat_session_id');
    if (!sessionId) {
      sessionId = 's' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('chat_session_id', sessionId);
    }

    // --- System prompt editor ---
    const promptToggle = document.getElementById('promptToggle');
    const promptEditor = document.getElementById('promptEditor');
    const systemPromptInput = document.getElementById('systemPromptInput');
    let promptOpen = false;

    const savedPrompt = localStorage.getItem('chat_system_prompt') || '';
    systemPromptInput.value = savedPrompt;

    promptToggle.addEventListener('click', () => {
      promptOpen = !promptOpen;
      promptEditor.classList.toggle('open', promptOpen);
      promptToggle.textContent = promptOpen ? '▾ Edit system prompt' : '▸ Edit system prompt';
    });
    systemPromptInput.addEventListener('input', () => {
      localStorage.setItem('chat_system_prompt', systemPromptInput.value);
    });

    // --- Image upload ---
    const chatImageInput = document.getElementById('chatImageInput');
    const imgPreview = document.getElementById('imgPreview');
    const imgPreviewImg = document.getElementById('imgPreviewImg');
    const imgRemove = document.getElementById('imgRemove');
    let uploadedImageData = null;
    let uploadedImageType = '';

    chatImageInput.addEventListener('change', () => {
      const file = chatImageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) return;
      uploadedImageType = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        uploadedImageData = base64;
        imgPreviewImg.src = e.target.result;
        imgPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });
    imgRemove.addEventListener('click', () => {
      uploadedImageData = null;
      uploadedImageType = '';
      chatImageInput.value = '';
      imgPreview.style.display = 'none';
      imgPreviewImg.src = '';
    });

    // --- Chat DOM refs ---
    const chatConv = document.getElementById('chatConversation');
    const chatInput = document.getElementById('chatInput');
    const chatStatus = document.getElementById('chatStatus');
    const chatSend = document.getElementById('chatSend');
    const chatStop = document.getElementById('chatStop');

    let currentController = null;

    function setStreaming(streaming) {
      chatSend.style.display = streaming ? 'none' : 'inline-block';
      chatStop.style.display = streaming ? 'inline-block' : 'none';
      chatSend.disabled = streaming;
    }

    function addMsg(role, content, asHtml) {
      const el = document.createElement('div');
      el.className = role === 'user' ? 'msg-user' : 'msg-assistant';
      if (role === 'user') {
        el.textContent = content || '';
      } else {
        el.dataset.fullResponse = (typeof content === 'string') ? content : '';
        el.innerHTML = asHtml ? (content || '') : escapeHtml(content || '');
      }
      chatConv.appendChild(el);
      chatConv.scrollTop = chatConv.scrollHeight;
      return el;
    }

    function addGenBtn(assistantEl) {
      const btn = document.createElement('button');
      btn.className = 'gen-btn';
      btn.textContent = 'Generate Image';
      btn.addEventListener('click', async () => {
        const prompt = assistantEl.dataset.fullResponse || assistantEl.textContent;
        if (!prompt) return;
        btn.disabled = true;
        btn.textContent = 'Generating...';

        const oldImg = assistantEl.querySelector('.msg-image');
        if (oldImg) oldImg.remove();

        const imgBox = document.createElement('div');
        imgBox.className = 'msg-image';
        imgBox.innerHTML = '<div class="stage-label">Generating...</div>';
        assistantEl.appendChild(imgBox);

        try {
          const resp = await fetch('/api/image/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: prompt, size: '1024x1024', progressive: true })
          });
          if (!resp.ok || !resp.body) throw new Error('Image stream failed');

          await consumeSseResponse(resp, {
            status: (d) => {
              const lbl = imgBox.querySelector('.stage-label');
              if (lbl) lbl.textContent = d.message || '';
            },
            image: (d) => {
              const src = d.data_url || d.url;
              if (src) {
                const stage = d.stage || 'preview';
                imgBox.innerHTML = `<div class="stage-label">Stage: ${stage}</div><img alt="${stage}" src="${src}" />`;
              }
            },
            error: (d) => {
              imgBox.innerHTML = `<div class="stage-label" style="color:var(--danger);">Error: ${d.message || 'Unknown'}</div>`;
            },
            done: () => {
              const lbl = imgBox.querySelector('.stage-label');
              if (lbl) lbl.textContent = 'Done';
              btn.textContent = 'Generate Image';
              btn.disabled = false;
            }
          });
        } catch (err) {
          imgBox.innerHTML = `<div class="stage-label" style="color:var(--danger);">${err.message}</div>`;
          btn.textContent = 'Generate Image';
          btn.disabled = false;
        }
      });
      assistantEl.appendChild(btn);
    }

    async function doChat() {
      const message = chatInput.value.trim();
      if (!message && !uploadedImageData) return;

      const systemPrompt = systemPromptInput.value.trim();

      chatStatus.textContent = 'Connecting...';
      setStreaming(true);

      // Build request body
      const body = { message: message || '(see attached image)', session_id: sessionId };
      if (systemPrompt) body.system_prompt = systemPrompt;
      if (uploadedImageData) {
        body.image_data = uploadedImageData;
        body.image_type = uploadedImageType;
      }

      // Add user bubble
      addMsg('user', message || '(image attached)');
      chatInput.value = '';
      imgRemove.click();

      // Create assistant bubble placeholder
      const assistantEl = addMsg('assistant', '<em>Waiting for response...</em>', true);

      currentController = new AbortController();

      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: currentController.signal
        });

        if (!response.ok || !response.body) {
          throw new Error('Unable to open chat stream.');
        }

        let fullText = '';
        assistantEl.innerHTML = '';

        await consumeSseResponse(response, {
          status: (data) => { chatStatus.textContent = data.message || ''; },
          token: (data) => {
            const text = data.text || '';
            fullText += text;
            assistantEl.dataset.fullResponse = fullText;
            assistantEl.innerHTML = renderMarkdown(fullText);
            chatConv.scrollTop = chatConv.scrollHeight;
          },
          error: (data) => {
            assistantEl.innerHTML = '<strong style="color:var(--danger);">Error:</strong> ' + escapeHtml(data.message || 'Unknown error');
            chatStatus.innerHTML = `<span class="error">${data.message || 'Unknown error'}</span>`;
          },
          done: () => {
            chatStatus.textContent = 'Done';
            addGenBtn(assistantEl);
          }
        });
      } catch (err) {
        if (err.name === 'AbortError') {
          chatStatus.textContent = 'Stopped';
          if (assistantEl.dataset.fullResponse) addGenBtn(assistantEl);
        } else {
          assistantEl.innerHTML = '<strong style="color:var(--danger);">Error:</strong> ' + escapeHtml(err.message);
          chatStatus.innerHTML = `<span class="error">${err.message}</span>`;
        }
      } finally {
        currentController = null;
        setStreaming(false);
      }
    }

    chatSend.addEventListener('click', doChat);

    chatStop.addEventListener('click', () => {
      if (currentController) {
        currentController.abort();
        chatStatus.textContent = 'Stopping...';
      }
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doChat();
      }
    });

    const imageInput = document.getElementById('imageInput');
    const imageOutput = document.getElementById('imageOutput');
    const imageStatus = document.getElementById('imageStatus');
    const imageSize = document.getElementById('imageSize');
    const imageSend = document.getElementById('imageSend');

    imageSend.addEventListener('click', async () => {
      const message = imageInput.value.trim();
      if (!message) return;

      imageSend.disabled = true;
      imageStatus.textContent = 'Connecting...';
      imageOutput.innerHTML = '<span class="status">Waiting for image stream...</span>';

      try {
        const response = await fetch('/api/image/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, size: imageSize.value, progressive: true })
        });

        if (!response.ok || !response.body) {
          throw new Error('Unable to open image stream.');
        }

        await consumeSseResponse(response, {
          status: (data) => { imageStatus.textContent = data.message || ''; },
          image: (data) => {
            const src = data.data_url || data.url;
            const stage = data.stage || 'preview';
            if (src) {
              imageOutput.innerHTML = `<div style="padding:8px;color:#6b7280;font-size:0.88rem;">Stage: ${stage}</div><img alt="Generated" src="${src}" />`;
            }
          },
          error: (data) => {
            imageStatus.innerHTML = `<span class="error">${data.message || 'Unknown error'}</span>`;
          },
          done: () => { imageStatus.textContent = 'Done'; }
        });
      } catch (err) {
        imageStatus.innerHTML = `<span class="error">${err.message}</span>`;
      } finally {
        imageSend.disabled = false;
      }
    });
  </script>
</body>
</html>
